# Example: Running snapshot-checker as a scheduled job
#
# This workflow runs the snapshot-checker to keep execution client snapshots updated.
# Can run as Docker container or as a binary.
#
# Prerequisites:
# - Self-hosted runner with access to Docker volumes

name: Snapshot Checker

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      execution_client:
        description: 'Execution client (geth, reth, nethermind, besu, erigon)'
        required: true
        default: 'geth'

jobs:
  # Option 1: Run as Docker container
  snapshot-check-docker:
    runs-on: self-hosted
    steps:
      - name: Run Snapshot Checker (Docker)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /var/lib/docker/volumes:/var/lib/docker/volumes \
            -e LOG_LEVEL=INFO \
            -e EXECUTION_CLIENT=${{ github.event.inputs.execution_client || 'geth' }} \
            -e NETWORK=hoodi \
            ghcr.io/dappnode/staker-test-util/snapshot-checker:latest

